<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>뷰로그</title>
<meta name="apple-mobile-web-app-title" content="뷰로그">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#7B3F61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --plum:#7B3F61; --plum-l:#A9739A; --navy:#1F3864; --navy-l:#4E6FA8;
  --bg:#F7F4F5; --card:#FFFFFF; --ink:#241A20; --ink2:#5E4E56; --muted:#948089;
  --line:#E7DEE2; --good:#3B6B4C; --warn:#A8620B; --bad:#A33A34;
  --warnbg:#FDF3E3; --badbg:#FBEBEA; --goodbg:#EAF3EC;
  --r:14px; --sh:0 1px 2px rgba(60,30,45,.06),0 8px 20px -14px rgba(60,30,45,.3);
  --tabh:62px;
}
@media (prefers-color-scheme:dark){
  :root{
    --plum:#D9A0C0; --plum-l:#B0789A; --navy:#8FADDF; --navy-l:#6E8FC4;
    --bg:#141014; --card:#1E1820; --ink:#F0E7EC; --ink2:#C6B5BF; --muted:#9C8894;
    --line:#362C36; --good:#7FBF95; --warn:#E0A75B; --bad:#E58B84;
    --warnbg:#2B2216; --badbg:#2E1D1D; --goodbg:#1B2A1F;
    --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;word-break:keep-all;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--plum)}

/* ── 헤더 ── */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
  border-bottom:1px solid var(--line);
}
.h-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.32rem;font-weight:700;letter-spacing:-.02em}
.h-sub{font-size:.78rem;color:var(--muted);white-space:nowrap}

main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
.page{display:none}
.page.on{display:block}

/* ── 카드 ── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;
}
.card-h{padding:12px 14px 0;font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.card-b{padding:12px 14px}
.sec-title{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:20px 2px 8px}
.sec-title:first-child{margin-top:4px}

/* ── 예약 항목 ── */
.bk{display:flex;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.bk:last-child{border-bottom:none}
.bk:active{background:var(--bg)}
.bk-bar{width:3px;align-self:stretch;border-radius:2px;background:var(--plum);flex:none}
.bk-bar.s2{background:var(--navy)}
.bk-t{font-variant-numeric:tabular-nums;font-weight:700;font-size:.98rem;width:52px;flex:none}
.bk-m{flex:1;min-width:0}
.bk-n{font-weight:600;display:block}
.bk-p{display:block;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-r{flex:none;text-align:right;font-size:.75rem;color:var(--muted)}
.bk.cancel{opacity:.5}
.bk.cancel .bk-n{text-decoration:line-through}

.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:.12em .5em;border-radius:5px;vertical-align:.1em}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.good{background:var(--goodbg);color:var(--good)}
.tag.plum{background:rgba(123,63,97,.12);color:var(--plum)}

.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:.9rem}

/* ── 알림 배너 ── */
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);margin-bottom:10px;font-size:.9rem}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert b{font-weight:700}
.alert .go{margin-left:auto;font-size:.8rem;font-weight:700;white-space:nowrap;opacity:.9}

/* ── 통계 타일 ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh)}
.tile .lb{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tile .vl{font-size:1.32rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.02em}
.tile .vl small{font-size:.72rem;font-weight:600;color:var(--muted);margin-left:2px}

/* ── 날짜 스트립 ── */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dbtn{flex:none;width:47px;padding:7px 0;border-radius:11px;text-align:center;background:var(--card);border:1px solid var(--line)}
.dbtn .dw{font-size:.68rem;color:var(--muted)}
.dbtn .dd{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.dbtn .dot{height:4px;width:4px;border-radius:50%;background:var(--plum);margin:2px auto 0}
.dbtn .dot.none{background:transparent}
.dbtn.sel{background:var(--plum);border-color:var(--plum);color:#fff}
.dbtn.sel .dw{color:rgba(255,255,255,.8)}
.dbtn.sel .dot{background:#fff}
.dbtn.sun .dd{color:var(--bad)}
.dbtn.sat .dd{color:var(--navy)}
.dbtn.sel .dd{color:#fff}

.daynav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);padding:2px 0 5px}
.cal .h.sun{color:var(--bad)}.cal .h.sat{color:var(--navy)}
.cal .cd{aspect-ratio:1/1;border:1px solid transparent;border-radius:10px;background:transparent;
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
   padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal .cd.out{pointer-events:none}
.cal .cd .n{font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.cal .cd.sun .n{color:var(--bad)}.cal .cd.sat .n{color:var(--navy)}
.cal .cd .cnt{font-size:.66rem;font-weight:700;line-height:1;min-height:15px;
   padding:2px 5px;border-radius:7px;background:var(--plum);color:#fff}
.cal .cd .cnt.none{background:transparent;padding:2px}
.cal .cd.today{border-color:var(--plum)}
.cal .cd.sel{background:var(--plum)}
.cal .cd.sel .n,.cal .cd.sel.sun .n,.cal .cd.sel.sat .n{color:#fff}
.cal .cd.sel .cnt{background:#fff;color:var(--plum)}
.cal .cd.sel .cnt.none{background:transparent}
.daynav .t{font-weight:700;font-size:1.05rem;flex:1}
.iconbtn{padding:6px 11px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:.85rem;font-weight:600}
.iconbtn:active{background:var(--bg)}

/* ── 폼 ── */
.field{margin-bottom:11px}
.field label{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
.ck{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);
    font-size:.9rem;line-height:1.5;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ck:last-child{border-bottom:0}
.ck input{width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--plum)}
.ck span{flex:1;padding-top:1px}
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:9px;
    font-size:.84rem;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer}
.seg button.on{background:#fff;color:var(--plum);box-shadow:var(--sh)}
.dt{width:100%;border-collapse:collapse;font-size:.82rem}
.dt th{text-align:left;font-size:.72rem;color:var(--muted);font-weight:700;padding:7px 6px;border-bottom:1px solid var(--line)}
.dt td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dt td.r,.dt th.r{text-align:right;font-variant-numeric:tabular-nums}
.dtwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.delta{font-size:.76rem;font-weight:700}
.delta.up{color:#0a7d4b}.delta.dn{color:var(--bad)}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--plum)}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:block;width:100%;padding:13px;border-radius:11px;font-weight:700;text-align:center;background:var(--plum);color:#fff}
.btn:active{opacity:.85}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
#lockwrap{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:330px;text-align:center}
.lockicon{font-size:2.2rem;margin-bottom:6px}
.lockbox h2{margin:0 0 4px;font-size:1.15rem}
.locksub{margin:0;font-size:.86rem;color:var(--muted)}
.lockbox input{width:100%;padding:14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;margin:16px 0 6px;text-align:center}
.lockmsg{min-height:19px;font-size:.83rem;color:var(--bad);margin-bottom:8px}
.pindots{display:flex;justify-content:center;gap:11px;margin:18px 0 4px;height:15px}
.pindots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);display:block}
.pindots i.f{background:var(--plum);border-color:var(--plum)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.keys button{padding:15px 0;border-radius:13px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);font-size:1.28rem;font-weight:600}
.keys button:active{background:var(--line)}
.keys button.f{background:transparent;border-color:transparent;font-size:1rem;color:var(--muted)}
.lockswap{display:block;width:100%;margin-top:10px;padding:9px;font-size:.83rem;color:var(--muted);background:transparent}
.whoami{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted)}
.whoami b{color:var(--ink);font-weight:700}
.rolechip{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;
  background:var(--linebg,var(--line));color:var(--ink2)}

/* ── 시트(모달) ── */
.mask{position:fixed;inset:0;background:rgba(20,10,16,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .24s cubic-bezier(.3,.8,.4,1);
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.25);
}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h2{margin:0 0 3px;font-size:1.14rem;font-weight:700}
.sheet .sub{color:var(--muted);font-size:.85rem;margin:0 0 14px}

/* ── 탭바 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{padding:8px 0 7px;font-size:.68rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:1.15rem;line-height:1}
nav.tabs button.on{color:var(--plum)}

/* ── 토스트 ── */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:11px;
  font-size:.88rem;font-weight:600;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 20px rgba(0,0,0,.3);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 로딩 ── */
.spin{width:19px;height:19px;border:2px solid var(--line);border-top-color:var(--plum);border-radius:50%;animation:sp .7s linear infinite;margin:22px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.sheet{transition:none}}

/* ── 매출 막대 ── */
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding:8px 0 0}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .b i{display:block;background:var(--plum);border-radius:3px 3px 0 0;min-height:2px}
.bars .b.n2 i{background:var(--navy)}
.bars .b span{font-size:.6rem;color:var(--muted);text-align:center;margin-top:3px}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--plum)}
.legend .n2 i{background:var(--navy)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header>
  <div class="h-row">
    <h1 id="ttl">오늘</h1>
    <div class="h-sub" id="sub">불러오는 중…</div>
  </div>
</header>

<main>
  <section class="page on" id="p-home"><div class="spin"></div></section>
  <section class="page" id="p-book"></section>
  <section class="page" id="p-cust"></section>
  <section class="page" id="p-sale"></section>
  <section class="page" id="p-cash"></section>
  <section class="page" id="p-tool"></section>
</main>

<nav class="tabs">
  <button class="on" data-p="home"><span class="ic">🏠</span>홈</button>
  <button data-p="book"><span class="ic">📅</span>예약</button>
  <button data-p="cust"><span class="ic">👤</span>고객</button>
  <button data-p="sale"><span class="ic">💰</span>매출</button>
  <button data-p="cash"><span class="ic">💸</span>지출</button>
  <button data-p="tool"><span class="ic">⚙️</span>도구</button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheet-b"></div></div>
<div id="toast"></div>

<script>
/* ══════════ 공통 ══════════ */
var APP = { boot:null, page:'home', view:'day', day:null, month:null, monthDots:{}, cust:null, salesYear:null, token:'', role:'owner', me:'' };
function isOwner(){ return APP.role !== 'staff'; }
function canSales(){ return !!(APP.boot && APP.boot.canSales); }

function tkGet(){ try { return localStorage.getItem('crm_tk') || ''; } catch(e){ return ''; } }
function tkSet(v){ try { localStorage.setItem('crm_tk', v || ''); } catch(e){} }
APP.token = tkGet();

function call(fn, args, noToken){
  return fetch('/api', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ fn: fn, args: args || [], token: noToken ? '' : (APP.token || '') }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if(r && r.authFail){ showLock('다시 로그인해 주세요'); throw new Error('로그인이 필요합니다'); }
      return r;
    });
}
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function won(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}
function spin(el){ el.innerHTML = '<div class="spin"></div>'; }
function fail(e){ toast('문제가 생겼습니다: ' + (e && e.message ? e.message : e)); }

var DOW = ['일','월','화','수','목','금','토'];
function ymd(d){
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function parseYmd(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function human(s){
  if(!s) return '';
  var d = parseYmd(s), t = new Date();
  var diff = Math.round((d - parseYmd(ymd(t))) / 86400000);
  var base = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
  if(diff === 0) return '오늘 · ' + base;
  if(diff === 1) return '내일 · ' + base;
  if(diff === -1) return '어제 · ' + base;
  return base;
}
function shopIdx(name){
  if(!APP.boot) return 1;
  for(var i=0;i<APP.boot.shops.length;i++) if(APP.boot.shops[i].name===name) return APP.boot.shops[i].idx;
  return 1;
}
function shopShort(name){
  /* 화면에는 샵 이름을 그대로 쓰되 띄어쓰기만 붙여서 보여줍니다 (약칭은 시트 이름에만) */
  return String(name || '').replace(/\s+/g, '');
}

/* ══════════ 시트(모달) ══════════ */
/* ── 뒤로 가기: 앱이 꺼지지 않고 '열린 창 닫기 → 이전 탭'으로 돌아가게 합니다 ── */
var NAV = { stack: [], busy: false, skip: 0 };
function navPush(kind){ NAV.stack.push(kind); try { history.pushState({ n: NAV.stack.length }, ''); } catch(e){} }
window.addEventListener('popstate', function(){
  if(NAV.skip > 0){ NAV.skip--; return; }
  var kind = NAV.stack.pop();
  if(kind === 'mini'){ var d = $('mini'); if(d) d.remove(); }
  else if(kind === 'sheet'){ NAV.busy = true; closeSheet(); NAV.busy = false; }
  else if(kind && kind.indexOf('tab:') === 0){ NAV.busy = true; switchTab(kind.slice(4)); NAV.busy = false; }
  else { try { history.pushState({ n: 0 }, ''); } catch(e){} toast('앱을 닫으려면 홈 버튼을 눌러 주세요'); }
});
try { history.replaceState({ n: 0 }, ''); history.pushState({ n: 0 }, ''); } catch(e){}
function openSheet(html){
  $('sheet-b').innerHTML = html;
  var was = $('sheet').classList.contains('on');
  $('sheet').classList.add('on'); $('mask').classList.add('on');
  if(!was) navPush('sheet');
}
function closeSheet(){
  var was = $('sheet').classList.contains('on');
  $('sheet').classList.remove('on'); $('mask').classList.remove('on');
  if(was && !NAV.busy && NAV.stack[NAV.stack.length-1] === 'sheet'){ NAV.stack.pop(); NAV.skip++; try { history.back(); } catch(e){ NAV.skip--; } }
}
$('mask').addEventListener('click', closeSheet);

/* ══════════ 탭 ══════════ */
document.querySelectorAll('nav.tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    var same = (APP.page === b.dataset.p);
    document.querySelectorAll('nav.tabs button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    go(b.dataset.p, same);
  });
});
/* 화면 캐시 — 탭을 다시 눌러도 서버를 또 부르지 않게 합니다 */
var PGCACHE = {}, PGFORCE = false, PG_MS = 90000;
function pgHit(id, key){
  if(PGFORCE) return false;
  var c = PGCACHE[id];
  if(!c || c.key !== key) return false;
  if(Date.now() - c.at > PG_MS) return false;
  var el = $(id);
  if(!el || !el.innerHTML.trim()) return false;
  $('ttl').textContent = c.ttl; $('sub').textContent = c.sub;
  return true;
}
function pgDone(id, key){
  PGCACHE[id] = { key:key, at:Date.now(),
                  ttl:$('ttl').textContent, sub:$('sub').textContent };
}
function pgClear(){ PGCACHE = {}; }

function go(p, force){
  if((p === 'sale' || p === 'cash') && !canSales()){ p = 'home'; }
  if(!NAV.busy && APP.page && APP.page !== p) navPush('tab:' + APP.page);
  PGFORCE = !!force;
  APP.page = p;
  document.querySelectorAll('.page').forEach(function(s){ s.classList.remove('on'); });
  $('p-'+p).classList.add('on');
  window.scrollTo(0,0);
  if(p==='home') renderHome();
  if(p==='book') renderBook();
  if(p==='cust') renderCust();
  if(p==='sale') renderSale();
  if(p==='cash') renderCash();
  if(p==='tool') renderTool();
  PGFORCE = false;
}
function switchTab(p){
  document.querySelectorAll('nav.tabs button').forEach(function(x){
    x.classList.toggle('on', x.dataset.p===p); });
  go(p);
}
/* 직원에게는 매출 탭을 감춥니다 */
function applyRole(){
  var show = canSales();
  document.querySelectorAll('nav.tabs button').forEach(function(x){
    if(x.dataset.p === 'sale' || x.dataset.p === 'cash') x.style.display = show ? '' : 'none';
  });
  document.querySelector('nav.tabs').style.gridTemplateColumns =
    'repeat(' + (show ? 6 : 4) + ',1fr)';
  if(!show && (APP.page === 'sale' || APP.page === 'cash')) switchTab('home');
}

/* ══════════ 예약 항목 HTML ══════════ */
function bkHtml(o){

function ackBlock(resno, kind, btn){

/* ══════════ 예약 ══════════ */
function weekStart(k){
  var d = parseYmd(k);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay());
}
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function dayLabel(k){
  var d = parseYmd(k);
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일(' + DOW[d.getDay()] + ')';
}
function bookSeg(v, t){
  return '<button class="' + (APP.view===v?'on':'') + '" onclick="setView(\'' + v + '\')">' + t + '</button>';
}
function setView(v){ APP.view = v; renderBook(); }

function renderBook(){
  $('ttl').textContent = '예약';
  if(!APP.day) APP.day = APP.boot ? APP.boot.today : ymd(new Date());
  if(!APP.view) APP.view = 'day';
  if(APP.view==='week') return renderWeek();
  if(APP.view==='month') return renderMonth();
  return renderDay();
}

/* ── 일 ── */
function renderDay(){
  var el = $('p-book');
  if(pgHit('p-book','day|'+APP.day)) return;
  $('sub').textContent = human(APP.day);

  var d0 = parseYmd(APP.day);
  var ym = APP.day.slice(0,7);

  var strip = '';
  for(var i=-3;i<=10;i++){
    var d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()+i);
    var k = ymd(d);
    var dot = APP.monthDots[k] ? '' : ' none';
    strip += '<button class="dbtn' + (k===APP.day?' sel':'') +
      (d.getDay()===0?' sun':'') + (d.getDay()===6?' sat':'') +
      '" onclick="pickDay(\'' + k + '\')">' +
      '<div class="dw">' + DOW[d.getDay()] + '</div>' +
      '<div class="dd">' + d.getDate() + '</div>' +
      '<div class="dot' + dot + '"></div></button>';
  }

  el.innerHTML =
    '<div class="seg">' + bookSeg('day','일') + bookSeg('week','주') + bookSeg('month','월') + '</div>' +
    '<div class="daynav"><div class="t">' + human(APP.day) + '</div>' +
    '<button class="iconbtn" onclick="goToday()">오늘</button>' +
    '<button class="iconbtn" onclick="openAdd()">＋ 예약</button>' +
    '<button class="iconbtn" onclick="openBlock(APP.day)">🔒 일정</button></div>' +
    '<div class="strip">' + strip + '</div>' +
    '<div id="daylist"><div class="spin"></div></div>';

  loadMonthDots(ym, 'day');
  loadDay();
  pgDone('p-book','day|'+APP.day);
}
function pickDay(k){ APP.day = k; renderBook(); }
function goToday(){ APP.day = APP.boot ? APP.boot.today : ymd(new Date()); renderBook(); }
function loadMonthDots(ym, back){
  if(APP.month === ym) return;
  APP.month = ym;
  call('api_month',[ym]).then(function(r){
    APP.monthDots = {};
    Object.keys(r.days).forEach(function(k){ APP.monthDots[k] = r.days[k].n; });
    if(APP.page==='book' && APP.view===back) renderBook();
  }).catch(function(){});
}
function loadDay(){
  var d = APP.day;
  Promise.all([ call('api_day',[d]), call('api_blocks',[d, d]) ]).then(function(res){
    var r = res[0], bl = res[1];
    var box = $('daylist');
    if(!box || APP.day !== d) return;
    var n = r.list.filter(function(o){ return o.status!=='취소'; }).length;
    var h = '<div class="sec-title">' + n + '건 · 빈 시간을 누르면 바로 매출을 넣을 수 있어요</div>' + slotGrid(d, r.list);
    var blist = (bl && bl.list) || [];
    if(blist.length){
      h += '<div class="sec-title">막아둔 시간 · ' + blist.length + '건</div>' +
           '<div class="card">' + blist.map(blockHtml).join('') + '</div>';
    }
    box.innerHTML = h;
  }).catch(fail);
}

/* ── 하루 시간표: 30분 칸마다 예약을 보여주고, 빈 칸을 누르면 그 시간에 매출을 넣습니다 ── */
function slotGrid(d, list){
  var by = {}, H0 = 9, H1 = 21;
  list.forEach(function(o){
    var m = /^(\d{1,2}):(\d{2})/.exec(o.time || ''); if(!m) { (by['기타'] = by['기타'] || []).push(o); return; }
    var hh = Number(m[1]), mm = Number(m[2]) < 30 ? '00' : '30';
    if(hh < H0) H0 = hh; if(hh > H1) H1 = hh;
    var k = (hh < 10 ? '0' : '') + hh + ':' + mm;
    (by[k] = by[k] || []).push(o);
  });
  var h = '<div class="card">';
  for(var hh = H0; hh <= H1; hh++){
    ['00','30'].forEach(function(mm){
      var k = (hh < 10 ? '0' : '') + hh + ':' + mm, L = by[k] || [];
      if(L.length){ h += L.map(bkHtml).join(''); return; }
      h += '<button class="bk" style="opacity:.55;min-height:40px" onclick="openQuickSale(\'' + d + '\',\'' + k + '\')">' +
        '<span class="bk-t">' + k + '</span><span class="bk-m"><span class="bk-p">＋ 이 시간에 매출 넣기</span></span></button>';
    });
  }
  if(by['기타']) h += by['기타'].map(bkHtml).join('');
  return h + '</div>';
}
function openQuickSale(d, t){
  var sh = APP.boot.shops.map(function(s){ return '<option value="'+esc(s.name)+'">'+esc(shopShort(s.name))+'</option>'; }).join('');
  openSheet(
    '<h2>매출 넣기</h2><p class="sub">' + human(d) + ' ' + t + '</p>' +
    '<div class="field"><label>샵</label><select id="q-shop">' + sh + '</select></div>' +
    '<div class="grid2">' +
      '<div class="field"><label>이름</label><input id="q-name" placeholder="손님 이름"></div>' +
      '<div class="field"><label>시간</label><input id="q-time" type="time" value="' + t + '"></div>' +
    '</div>' +
    '<div class="field"><label>연락처 (몰라도 돼요)</label><input id="q-phone" type="tel" inputmode="tel" placeholder="010-"></div>' +
    '<button class="btn" onclick="quickSale(\'' + d + '\')">다음 — 시술·할인·결제 고르기</button>' +
    '<div class="btnrow"><button class="btn sub" style="grid-column:1/3" onclick="closeSheet()">취소</button></div>'
  );
}
function quickSale(d){
  var p = { shop: $('q-shop').value, date: d, time: $('q-time').value, name: $('q-name').value,
            phone: $('q-phone').value, product: '', amount: '', staff: '', request: '' };
  if(!p.name.trim()){ toast('이름을 넣어주세요'); return; }
  toast('만드는 중…');
  call('api_addBooking',[p]).then(function(r){
    if(!r.ok){ toast(r.msg); return; }
    $('p-home').dataset.loaded = ''; pgClear(); APP.month = null;
    openPay(r.resno);
  }).catch(fail);
}

/* ── 주 ── */
function shiftWeek(n){
  var s = weekStart(APP.day);
  APP.day = ymd(addDays(s, n*7));
  renderBook();
}
function renderWeek(){
  var el = $('p-book');
  var s0 = weekStart(APP.day), s6 = addDays(s0, 6);
  var from = ymd(s0), to = ymd(s6);
  $('sub').textContent = dayLabel(from) + ' ~ ' + dayLabel(to);

  el.innerHTML =
    '<div class="seg">' + bookSeg('day','일') + bookSeg('week','주') + bookSeg('month','월') + '</div>' +
    '<div class="daynav">' +
      '<button class="iconbtn" onclick="shiftWeek(-1)">‹</button>' +
      '<div class="t" style="text-align:center;font-size:.95rem">' +
        (s0.getMonth()+1) + '.' + s0.getDate() + ' ~ ' + (s6.getMonth()+1) + '.' + s6.getDate() + '</div>' +
      '<button class="iconbtn" onclick="shiftWeek(1)">›</button>' +
      '<button class="iconbtn" onclick="goToday()">오늘</button>' +
    '</div>' +
    '<div id="weeklist"><div class="spin"></div></div>';

  Promise.all([ call('api_range',[from, to]), call('api_blocks',[from, to]) ]).then(function(res){
    var r = res[0], bl = res[1];
    var box = $('weeklist'); if(!box) return;
    if(!r.ok){ box.innerHTML = '<div class="card"><div class="empty">' + esc(r.msg||'불러오지 못했습니다') + '</div></div>'; return; }
    var by = {}, bby = {};
    (r.list||[]).forEach(function(o){ (by[o.date] = by[o.date] || []).push(o); });
    ((bl&&bl.list)||[]).forEach(function(o){ (bby[o.date] = bby[o.date] || []).push(o); });

    var today = APP.boot ? APP.boot.today : ymd(new Date());
    var h = '', total = 0;
    for(var i=0;i<7;i++){
      var d = addDays(s0, i), k = ymd(d);
      var list = by[k] || [];
      var n = list.filter(function(o){ return o.status!=='취소'; }).length;
      total += n;
      h += '<div class="sec-title" style="display:flex;align-items:center;gap:7px">' +
        '<span style="' + (d.getDay()===0?'color:var(--bad)':(d.getDay()===6?'color:var(--navy)':'')) + '">' +
          (d.getMonth()+1) + '.' + d.getDate() + '(' + DOW[d.getDay()] + ')</span>' +
        (k===today ? '<span class="tag plum">오늘</span>' : '') +
        '<span style="margin-left:auto;font-weight:600;color:var(--muted)">' + n + '건</span></div>';
      var bl2 = bby[k] || [];
      h += (list.length || bl2.length)
        ? '<div class="card">' + list.map(bkHtml).join('') + bl2.map(blockHtml).join('') + '</div>'
        : '<div class="card"><div class="empty" style="padding:12px">예약 없음</div></div>';
    }

function shiftMonth(n){
  var d = parseYmd(APP.day);
  var t = new Date(d.getFullYear(), d.getMonth()+n, 1);
  var last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  APP.day = ymd(new Date(t.getFullYear(), t.getMonth(), Math.min(d.getDate(), last)));
  APP.month = null; APP.monthDots = {};
  renderBook();
}
function renderMonth(){
  var el = $('p-book');
  var d = parseYmd(APP.day);
  var ym = APP.day.slice(0,7);
  var first = new Date(d.getFullYear(), d.getMonth(), 1);
  var last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  var today = APP.boot ? APP.boot.today : ymd(new Date());
  $('sub').textContent = d.getFullYear() + '년 ' + (d.getMonth()+1) + '월';

  var head = '';
  for(var w=0;w<7;w++){
    head += '<div class="h' + (w===0?' sun':(w===6?' sat':'')) + '">' + DOW[w] + '</div>';
  }
  var cells = '';
  for(var b=0;b<first.getDay();b++) cells += '<div class="cd out"></div>';
  var mtotal = 0;
  for(var day=1; day<=last; day++){
    var cd = new Date(d.getFullYear(), d.getMonth(), day);
    var k = ymd(cd);
    var n = APP.monthDots[k] || 0;
    mtotal += n;
    cells += '<button class="cd' + (k===APP.day?' sel':'') + (k===today?' today':'') +
      (cd.getDay()===0?' sun':(cd.getDay()===6?' sat':'')) +
      '" onclick="pickCal(\'' + k + '\')">' +
      '<span class="n">' + day + '</span>' +
      (n ? '<span class="cnt">' + n + '</span>' : '<span class="cnt none"></span>') +
      '</button>';
  }

  el.innerHTML =
    '<div class="seg">' + bookSeg('day','일') + bookSeg('week','주') + bookSeg('month','월') + '</div>' +
    '<div class="daynav">' +
      '<button class="iconbtn" onclick="shiftMonth(-1)">‹</button>' +
      '<div class="t" style="text-align:center">' + d.getFullYear() + '년 ' + (d.getMonth()+1) + '월</div>' +
      '<button class="iconbtn" onclick="shiftMonth(1)">›</button>' +
      '<button class="iconbtn" onclick="goToday()">오늘</button>' +
    '</div>' +
    '<div class="card"><div class="card-b" style="padding:10px">' +
      '<div class="cal">' + head + cells + '</div></div></div>' +
    '<p style="font-size:.78rem;color:var(--muted);padding:0 4px;margin:0 0 4px">' +
      '이번 달 ' + mtotal + '건 · 날짜를 누르면 그날 예약이 아래에 나옵니다</p>' +
    '<div id="daylist"><div class="spin"></div></div>';

  if(APP.month !== ym){
    APP.month = ym;
    call('api_month',[ym]).then(function(r){
      APP.monthDots = {};
      Object.keys(r.days).forEach(function(k){ APP.monthDots[k] = r.days[k].n; });
      if(APP.page==='book' && APP.view==='month') renderBook();
    }).catch(function(){});
  }
  loadDay();
}

var PAY = { resno:'', menu:[], items:[], discount:0, b:null, staff:'', feeRate:0, creditRate:0, debitRate:0, foreignRate:0,
            payList:[], staffList:[], splits:[], scalp:null, extra:null, calc:null };
var SCALP_SPOTS = ['헤어라인','M자 이마','정수리','가르마','구레나룻','원형탈모','흉터커버'];
/* '신용카드:2690000+네이버페이:30000' → '신용카드 2,690,000 + 네이버페이 30,000' */
function payLabel(p){
  p = String(p||'');
  if(p.indexOf(':') < 0) return p;
  return p.split('+').map(function(x){ var a = x.split(':'); return a[0] + ' ' + won(Number(a[1]||0)); }).join(' + ');
}
function payBaseList(){ return (PAY.payList||[]).filter(function(x){ return x.indexOf('+') < 0; }); }
function splitsFromSaved(pay, npay, total){
  pay = String(pay||'');
  if(pay.indexOf(':') >= 0) return pay.split('+').map(function(x){ var a = x.split(':'); return { m:a[0], amt:Number(a[1]||0) }; });
  if(pay.indexOf('+') >= 0){
    var ms = pay.split('+'), n = Number(npay||0);
    return [{ m:ms[0], amt:Math.max(0, total - n) }, { m:ms[1], amt:n }];
  }
  return [{ m:pay, amt:0 }];
}
function openPay(resno){
  toast('불러오는 중…');
  call('api_payment',[resno]).then(function(r){
    if(!r.ok){ toast(r.msg||'불러오지 못했습니다'); return; }
    PAY.resno = resno; PAY.menu = r.menu||[]; PAY.b = r.booking;
    PAY.items = (r.items||[]).map(function(it){ return {name:it.name, amount:Number(it.amount||0)}; });
    if(!PAY.items.length) PAY.items = [{name:'', amount:0}];
    PAY.discount = Number(r.discount||0);
    PAY.staff = r.staff||'';
    PAY.feeRate = Number(r.feeRate||0);
    PAY.creditRate = Number(r.creditRate||0); PAY.debitRate = Number(r.debitRate||0); PAY.foreignRate = Number(r.foreignRate||0);
    PAY.payList = r.payList||[]; PAY.staffList = r.staffList||[];
    PAY.scalp = r.scalp || { one:250000, twoPre:450000 };
    PAY.splits = splitsFromSaved(r.pay, r.npay, payTotal());
    PAY.extra = null;
    PAY.calc = { spots:{}, parts:'', service:'', mode:'1', friend:'' };
    drawPay();
    if(shopIdx(PAY.b.shop) === 2 && PAY.b.custId){
      call('api_custExtra',[PAY.b.custId]).then(function(x){ if(x && x.ok){ PAY.extra = x; var el = $('pay-extra'); if(el) el.innerHTML = payExtraHtml(); } }).catch(function(){});
    }
  }).catch(fail);
}
function payTotal(){
  var t = 0;
  PAY.items.forEach(function(it){ t += Number(it.amount||0); });
  return t - Number(PAY.discount||0);
}
function payExtraHtml(){

/* 두피 금액 계산 (닥터뷰티랩) */
function calcHtml(){
  var c = PAY.calc, sp = PAY.scalp;
  var chips = SCALP_SPOTS.map(function(x, i){
    return '<label class="ck" style="display:inline-flex;gap:5px;margin:0 10px 6px 0"><input type="checkbox" ' + (c.spots[x]?'checked ':'') +

    '<div style="font-size:.85rem;margin-bottom:4px">시술 위치</div><div>' + chips + '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>부위 수 (명함 1장 = 1부위, 서비스 포함)</label><input type="number" inputmode="numeric" value="' + esc(c.parts) + '" oninput="PAY.calc.parts=this.value"></div>' +
      '<div class="field"><label>그중 서비스 부위</label><input type="number" inputmode="numeric" value="' + esc(c.service) + '" oninput="PAY.calc.service=this.value" placeholder="0"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>횟수</label><select onchange="PAY.calc.mode=this.value">' +
        [['1','1회 (부위당 ' + won(sp.one) + '원)'],['2','2회 함께 결제 (부위당 ' + won(sp.twoPre) + '원)'],['r2','2회차 (이미 결제)']].map(function(o){
          return '<option value="' + o[0] + '"' + (c.mode===o[0]?' selected':'') + '>' + o[1] + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field"><label>지인 할인</label><input type="number" inputmode="numeric" value="' + esc(c.friend) + '" oninput="PAY.calc.friend=this.value" placeholder="0"></div>' +
    '</div>' +
    '<button class="btn sub" onclick="applyCalc()">이 내용으로 금액 넣기</button>' +
    '</div></div>';
}
function applyCalc(){
  var c = PAY.calc, sp = PAY.scalp;
  var n = Math.max(0, Number(c.parts||0)), sv = Math.max(0, Number(c.service||0)), fr = Math.max(0, Number(c.friend||0));
  if(!n){ toast('부위 수를 넣어 주세요'); return; }
  if(sv > n){ toast('서비스 부위가 전체 부위보다 많아요'); return; }
  var spots = SCALP_SPOTS.filter(function(x){ return c.spots[x]; });
  var tail = (spots.length ? spots.join('·') : '') + (sv ? (spots.length ? ', ' : '') + '서비스 ' + sv + '부위' : '');
  var name, full = 0, disc = 0;
  if(c.mode === 'r2'){
    name = '두피 ' + n + '부위 2회차';
  } else if(c.mode === '2'){
    name = '두피 ' + n + '부위 2회 함께 결제';
    full = sp.one * 2 * n;
    disc = (sp.one * 2 - sp.twoPre) * n + sp.twoPre * sv + fr;
  } else {
    name = '두피 ' + n + '부위 1회';
    full = sp.one * n;
    disc = sp.one * sv + fr;
  }
  if(tail) name += ' (' + tail + ')';
  PAY.items = [{ name:name, amount:full }];
  PAY.discount = disc;
  drawPay();
  toast('정가 ' + won(full) + '원 · 할인 ' + won(disc) + '원으로 넣었어요');
}

      '<select onchange="PAY.splits[' + i + '].m=this.value;payFee()">' + selOpts(base, x.m, '결제수단 선택') + '</select>' +
      (many ? '<input type="number" inputmode="numeric" placeholder="금액" value="' + (x.amt||'') + '" oninput="PAY.splits[' + i + '].amt=this.value;payFee()">' +
              '<button class="btn danger" style="padding:0" onclick="PAY.splits.splice(' + i + ',1);redrawSplits()">✕</button>' : '') +
      '</div>';
  }).join('') +
  '<button class="btn sub" style="margin-bottom:8px" onclick="PAY.splits.push({m:\'\',amt:0});redrawSplits()">＋ 결제수단 나눠 넣기</button>';
}
function redrawSplits(){
  if(PAY.splits.length === 1) PAY.splits[0].amt = 0;
  var el = $('pay-split'); if(el) el.innerHTML = splitRowsHtml(); payFee();
}
function rateFor(m){
  m = String(m||'');
  if(m.indexOf('네이버') >= 0) return PAY.feeRate;
  if(m.indexOf('카드') < 0) return 0;
  if(m.indexOf('해외') >= 0) return PAY.foreignRate;
  return m.indexOf('체크') >= 0 ? PAY.debitRate : PAY.creditRate;
}
function payFeeText(){
  var t = payTotal(), list = PAY.splits;
  if(list.length === 1){
    var r1 = rateFor(list[0].m);
    return r1 ? '수수료 약 ' + won(Math.round(t * r1 / 100)) + '원' : '';
  }
  var sum = 0, fee = 0;
  list.forEach(function(x){ var a = Number(x.amt||0); sum += a; fee += Math.round(a * rateFor(x.m) / 100); });
  var diff = t - sum;
  return '수수료 약 ' + won(fee) + '원' + (diff ? ' · <b style="color:var(--bad)">나눠 넣은 합계가 실결제금액과 ' + won(Math.abs(diff)) + '원 ' + (diff > 0 ? '모자라요' : '많아요') + '</b>' : '');
}
function payFee(){ var el = $('pay-fee'); if(el) el.innerHTML = payFeeText(); }
function drawPay(){
  var b = PAY.b, isDr = shopIdx(b.shop) === 2;
  var rows = PAY.items.map(function(it, i){
    var opts = '<option value="">직접 입력</option>' + PAY.menu.map(function(m){

    return '<div class="card" style="margin-bottom:8px"><div class="card-b">' +
      '<div class="field"><label>시술 ' + (i+1) + ' — 메뉴에서 고르기</label>' +
        '<select onchange="payPick(' + i + ',this.value)">' + opts + '</select></div>' +
      '<div class="field"><label>시술명</label><input value="' + esc(it.name) + '" oninput="PAY.items[' + i + '].name=this.value"></div>' +
      '<div class="field"><label>금액 (정가)</label><input type="number" inputmode="numeric" value="' + (it.amount||'') + '" oninput="PAY.items[' + i + '].amount=this.value;paySum()"></div>' +
      (PAY.items.length>1 ? '<button class="btn danger" onclick="PAY.items.splice(' + i + ',1);drawPay()">이 항목 빼기</button>' : '') +
      '</div></div>';
  }).join('');
  openSheet(
    '<h2>결제 등록</h2><p class="sub">' + esc(b.name) + ' · ' + human(b.date) + ' ' + esc(b.time) + '</p>' +

    '<button class="btn sub" onclick="PAY.items.push({name:\'\',amount:0});drawPay()">＋ 시술 항목 추가</button>' +
    '<div class="field" style="margin-top:12px"><label>할인 금액</label>' +
      '<input type="number" inputmode="numeric" value="' + (PAY.discount||'') + '" oninput="PAY.discount=this.value;paySum()" placeholder="0"></div>' +
    '<div class="card"><div class="card-b"><div class="kv">' +
      '<span style="font-weight:700">실결제금액</span>' +
      '<b id="pay-sum" style="color:' + (payTotal() < 0 ? 'var(--bad)' : 'var(--plum)') + ';font-weight:700;font-size:1.05rem">' + won(payTotal()) + '원</b>' +
      '</div></div></div>' +
    '<div class="field" style="margin-top:10px"><label>결제수단</label></div>' +
    '<div id="pay-split">' + splitRowsHtml() + '</div>' +
    '<p id="pay-fee" style="font-size:.8rem;color:var(--muted);margin:-2px 0 10px;padding:0 4px">' + payFeeText() + '</p>' +
    '<div class="field"><label>담당자</label><select onchange="PAY.staff=this.value">' +
        selOpts(PAY.staffList, PAY.staff, '지정 안 함') + '</select></div>' +
    '<button class="btn" style="margin-top:4px" onclick="savePay(this)">저장하고 이용완료 처리</button>' +
    '<div class="btnrow"><button class="btn sub" style="grid-column:1/3" onclick="closeSheet()">취소</button></div>'
  );

function payPick(i, name){
  if(!name) return;
  var m = null;
  PAY.menu.forEach(function(x){ if(x.name===name) m = x; });

function paySum(){ var el = $('pay-sum'); if(el){ el.textContent = won(payTotal()) + '원'; el.style.color = payTotal() < 0 ? 'var(--bad)' : 'var(--plum)'; } payFee(); }
function savePay(btn){
  var t = payTotal();
  if(t < 0){ toast('할인이 시술 금액보다 커서 실결제금액이 0원보다 작아요. 금액을 다시 확인해 주세요.'); return; }
  var list = PAY.splits.filter(function(x){ return x.m; }), pay = '', npay = 0;
  if(list.length > 1){
    var sum = 0; list.forEach(function(x){ sum += Number(x.amt||0); });
    if(sum !== t){ toast('나눠 넣은 금액 합계(' + won(sum) + '원)가 실결제금액(' + won(t) + '원)과 달라요'); return; }
    pay = list.map(function(x){ return x.m + ':' + Number(x.amt||0); }).join('+');
    list.forEach(function(x){ if(x.m.indexOf('네이버') >= 0) npay += Number(x.amt||0); });
  } else if(list.length === 1){
    pay = list[0].m; if(pay.indexOf('네이버') >= 0) npay = t;
  }
  busy(btn, '저장 중…');
  call('api_savePayment',[{resno:PAY.resno, items:PAY.items, discount:PAY.discount, pay:pay, staff:PAY.staff, npay:npay}]).then(function(r){
    done(btn);

    closeSheet(); toast('매출 ' + won(r.total) + '원으로 등록했습니다');

    if(APP.page==='book') loadDay(); else if(APP.page==='sale') renderSale(); else renderHome();

}

function gradeTag(g){
  if(!g) return '';
  var cls = (g==='VIP'||g==='단골') ? 'plum' : (g==='블랙리스트' ? 'bad' : (g==='휴면' ? 'warn' : 'good'));
  return ' <span class="tag ' + cls + '">' + esc(g) + '</span>';
}
function custSearch(){
  clearTimeout(_ct);
  _ct = setTimeout(function(){
    var q = $('c-q') ? $('c-q').value : '';
    call('api_searchCustomers',[q, CFIL]).then(function(r){
      var box = $('c-list'); if(!box) return;
      drawFilter(r);
      if(!r.list.length){
        box.innerHTML = '<div class="card"><div class="empty">' +
          (CFIL ? '이 조건에 맞는 고객이 없습니다' : '찾는 고객이 없습니다') + '</div></div>';
        return;
      }
      var h = '<div class="sec-title">' + r.total + '명' +
        (CFIL ? ' · ' + esc(CFIL) : '') +
        (r.total>r.list.length?' (앞 '+r.list.length+'명)':'') + '</div><div class="card">';
      r.list.forEach(function(c){
        var t = gradeTag(c.grade);
        t += langTag(c);
        if(c.caution) t += ' <span class="tag bad">주의</span>';
        if(!c.phone && !c.safe && !c.cid) t += ' <span class="tag warn">번호없음</span>';
        else if(c.total!==null && c.left!==null && c.left<=1) t += ' <span class="tag bad">잔여 '+c.left+'</span>';
        var sub = (c.phone || c.safe || (c.cid ? (c.cway ? c.cway + ' ' : '') + c.cid : '연락처 미입력')) + ' · ' + c.visits + '회';
        if(c.prepaid) sub += ' · 선불 ' + won(c.prepaid);
        if(c.tag) sub += ' · ' + c.tag;
        h += '<button class="bk" onclick="openCustomer(\'' + esc(c.id) + '\')">' +
          '<span class="bk-bar' + (shopIdx(c.shop)===2?' s2':'') + '"></span>' +
          '<span class="bk-m"><span class="bk-n">' + esc(c.name) + t + '</span>' +
          '<span class="bk-p">' + esc(sub) + '</span></span>' +
          '<span class="bk-r">' + (c.last ? esc(c.last.slice(2).replace(/-/g,'.')) : '') + '</span></button>';
      });
      box.innerHTML = h + '</div>';
    }).catch(fail);
  }, 220);
}
/* ── 연결 고객: 이름을 치면 고객 목록을 띄우고, 고르면 '이름(뒷4자리)'로 넣습니다 ── */
var _rt = null, _relL = [];
function relParts(v){ return String(v||'').split(',').map(function(x){ return x.trim(); }).filter(function(x){ return x; }); }
function relSuggest(el){
  relChips(el.value);
  clearTimeout(_rt);
  var parts = String(el.value).split(','), term = parts[parts.length-1].trim();
  var box = $('rel-sug'); if(!box) return;
  if(!term || /\(\d{4}\)/.test(term)){ box.innerHTML = ''; return; }
  _rt = setTimeout(function(){
    call('api_searchCustomers',[term, '']).then(function(r){
      var self = el.getAttribute('data-self');
      var L = (r.list || []).filter(function(c){ return c.id !== self; }).slice(0, 6);
      if(!L.length){ box.innerHTML = ''; return; }
      _relL = L;
      box.innerHTML = '<div class="card" style="margin:-4px 0 8px"><div class="card-b" style="padding:4px 10px">' + L.map(function(c){
        var p4 = String(c.phone || c.safe || '').replace(/[^0-9]/g,'').slice(-4);
        return '<button type="button" class="bk" style="width:100%" onclick="relPick(' + L.indexOf(c) + ')">' +
          '<span class="bk-bar' + (shopIdx(c.shop)===2?' s2':'') + '"></span>' +
          '<span class="bk-m"><span class="bk-n">' + esc(c.name) + '</span><span class="bk-p">' + esc((c.phone||c.safe||'번호 없음') + ' · ' + c.shop) + '</span></span></button>';
      }).join('') + '</div></div>';
    }).catch(function(){});
  }, 250);
}
function relPick(i){
  var c = _relL[i], el = $('k-rel'); if(!c || !el) return;
  var name = c.name, p4 = String(c.phone || c.safe || '').replace(/[^0-9]/g,'').slice(-4);
  var parts = String(el.value).split(',');
  parts[parts.length-1] = ' ' + name + (p4 ? '(' + p4 + ')' : '');
  el.value = parts.join(',').replace(/^\s+/,'');
  relChips(el.value);
  /* 고른 다음 관계를 바로 고를 수 있게 */
  var R = ['배우자','가족','친구','지인','직장 동료','소개해 준 분','소개받은 분'];
  $('rel-sug').innerHTML = '<div class="card" style="margin:-4px 0 8px"><div class="card-b">' +
    '<div style="font-size:.82rem;color:var(--muted);margin-bottom:6px">' + esc(name) + ' 님과의 관계</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
      R.map(function(x){ return '<button type="button" class="tag" style="border:0;cursor:pointer;padding:6px 10px" onclick="relSet(this.textContent)">' + esc(x) + '</button>'; }).join('') +
    '</div>' +
    '<div style="display:flex;gap:6px;margin-top:8px"><input id="rel-own" placeholder="직접 쓰기 (예: 언니)" style="flex:1">' +
      '<button type="button" class="btn sub" style="width:auto;margin:0;padding:8px 12px" onclick="relSet($(\'rel-own\').value)">넣기</button></div>' +
    '<button type="button" class="btn sub" style="margin-top:8px" onclick="relSet(\'\')">관계 없이 넘어가기</button>' +
  '</div></div>';
}
function relSet(r){
  var el = $('k-rel'); if(!el) return;
  r = String(r || '').trim();
  el.value = el.value.replace(/[,\s]+$/,'') + (r ? ' (' + r + ')' : '') + ', ';
  $('rel-sug').innerHTML = '';
  relChips(el.value); el.focus();
}
function relChips(v){
  var box = $('rel-chips'); if(!box) return;
  box.innerHTML = relParts(v).map(function(x){
    var m = /^([^(]+?)\s*\((\d{4})\)/.exec(x); if(!m) return '';
    return '<button type="button" class="tag" style="border:0;cursor:pointer" data-n="' + esc(m[1]) + '" data-p="' + m[2] + '" onclick="relOpen(this.dataset.n,this.dataset.p)">🔗 ' + esc(x) + '</button>';
  }).join('');
}
function relOpen(name, p4){
  call('api_searchCustomers',[name, '']).then(function(r){
    var hit = (r.list || []).filter(function(c){ return c.name === name && String(c.phone||c.safe||'').replace(/[^0-9]/g,'').slice(-4) === p4; })[0];
    if(hit) openCustomer(hit.id); else toast('그 고객을 찾지 못했어요');
  }).catch(fail);
}
/* 연락 방법 바로가기 · 외국어 표시 */
function langTag(c){ return (c.lang && c.lang !== '한국어') ? ' <span class="tag plum">' + esc(c.lang) + '</span>' : ''; }
function contactLink(c){
  var id = String(c.cid||'').trim().replace(/^@/,''); if(!id) return '';
  var u = '';
  if(c.cway === '인스타 DM') u = 'https://ig.me/m/' + encodeURIComponent(id);
  else if(c.cway === '왓츠앱') u = 'https://wa.me/' + id.replace(/[^0-9]/g,'');
  else if(c.cway === '라인') u = 'https://line.me/R/ti/p/~' + encodeURIComponent(id);
  if(!u) return '';
  return '<a class="btn sub" style="display:block;text-align:center;margin:0 0 8px;text-decoration:none" href="' + u + '" target="_blank" rel="noopener">💬 ' + esc(c.cway) + '로 연락하기</a>';
}
function openCustomer(id){
  openSheet('<div class="spin"></div>');
  call('api_customer',[id]).then(function(r){
    if(!r.ok){ closeSheet(); toast(r.msg); return; }
    APP.cust = r;
    drawCustomer();
    loadEsign(id);
    loadCustExtra(id);
  }).catch(function(e){ closeSheet(); fail(e); });
}

      esc(b.start) + ' ~ ' + esc(b.end) + ' · ' + esc(st) + '</b></div>';

function loadCustExtra(id){
  call('api_custExtra',[id]).then(function(x){

function selOpts(list, cur, blank){
  var h = '<option value="">' + esc(blank||'—') + '</option>';
  (list||[]).forEach(function(x){
    h += '<option value="'+esc(x)+'"'+(String(x)===String(cur||'')?' selected':'')+'>'+esc(x)+'</option>';
  });
  return h;
}

/* ── 시술 전·후 사진 ── */
var PHOTO = { id:'', kind:'전' };
/* ══════════ 시술 사진 (원본 보관) ══════════ */
var PSET = {
  '눈썹': ['정면 눈뜸','정면 눈감음','왼쪽 눈뜸','왼쪽 눈감음','오른쪽 눈뜸','오른쪽 눈감음','눈썹 확대'],
  '입술': ['정면','정면 확대','왼쪽','오른쪽'],
  '두피': ['정수리','헤어라인 정면','왼쪽','오른쪽','확대'],
  '자유': []
};
function phUrl(k, dl){ return '/photo/file?k=' + encodeURIComponent(k) + '&t=' + encodeURIComponent(APP.token || '') + (dl ? '&dl=1' : ''); }
function openPhoto(id, kind, set){
  PHOTO.id = id; PHOTO.kind = kind || PHOTO.kind || '전'; PHOTO.set = set || PHOTO.set || '눈썹';
  PHOTO.date = PHOTO.date || APP.boot.today;
  openSheet('<div class="spin"></div>');
  call('api_photos',[id]).then(function(r){
    PHOTO.list = (r && r.list) || [];
    drawPhoto();
  }).catch(fail);
}
function drawPhoto(){
  var id = PHOTO.id, today = PHOTO.date;
  var tabs = ['전','후','리터치'].map(function(k){
    return '<button class="btn ' + (PHOTO.kind===k?'':'sub') + '" onclick="openPhoto(\'' + esc(id) + '\',\'' + k + '\')">' + k + '</button>'; }).join('');
  var sets = Object.keys(PSET).map(function(k){
    return '<option' + (PHOTO.set===k?' selected':'') + '>' + k + '</option>'; }).join('');
  var mine = PHOTO.list.filter(function(p){ return p.date === today && p.kind === PHOTO.kind; });
  function bySlot(s){ var f = null; mine.forEach(function(p){ if(p.slot === s) f = p; }); return f; }
  var slots = PSET[PHOTO.set].map(function(s){

var SIG = { cv:null, cx:null, on:false, drawn:false };

/* ══════════ 매출 ══════════ */
var SALE = { from:'', to:'', shop:'', period:'month' };
function saleInit(){
  var d = new Date();
  SALE.from = ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  SALE.to   = ymd(d);
  SALE.period = 'month';
}
function salePick(k){
  var d = new Date();
  SALE.period = k;
  if(k==='today'){ SALE.from = ymd(d); SALE.to = ymd(d); }
  else if(k==='week'){ SALE.from = ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate()-6)); SALE.to = ymd(d); }
  else if(k==='month'){ SALE.from = ymd(new Date(d.getFullYear(), d.getMonth(), 1)); SALE.to = ymd(d); }
  else if(k==='prev'){
    var f = new Date(d.getFullYear(), d.getMonth()-1, 1);
    SALE.from = ymd(f); SALE.to = ymd(new Date(d.getFullYear(), d.getMonth(), 0));
  }
  else if(k==='year'){ SALE.from = ymd(new Date(d.getFullYear(),0,1)); SALE.to = ymd(d); }
  renderSale();
}
function saleRange(){
  SALE.period = '';
  SALE.from = $('sl-f').value || SALE.from;
  SALE.to   = $('sl-t').value || SALE.to;
  renderSale();
}
function saleShop(v){ SALE.shop = v; renderSale(); }
function deltaHtml(cur, prev){
  if(!prev) return '<span class="delta" style="color:var(--muted)">비교 없음</span>';
  var d = cur - prev;
  var pct = Math.round(d / prev * 1000) / 10;
  if(!d) return '<span class="delta" style="color:var(--muted)">변화 없음</span>';
  return '<span class="delta ' + (d>0?'up':'dn') + '">' + (d>0?'▲':'▼') + ' ' +
    won(Math.abs(d)) + ' (' + (d>0?'+':'-') + Math.abs(pct) + '%)</span>';
}
function renderSale(){
  var el = $('p-sale');
  if(!SALE.from) saleInit();
  SALE.key = 'sale|' + SALE.from + '|' + SALE.to + '|' + (SALE.shop||'');
  if(pgHit('p-sale', SALE.key)) return;
  $('ttl').textContent = '매출';
  $('sub').textContent = SALE.from.slice(2).replace(/-/g,'.') + ' ~ ' + SALE.to.slice(2).replace(/-/g,'.');
  spin(el);
  call('api_salesReport',[SALE.from, SALE.to, SALE.shop]).then(function(d){
    if(!d.ok){ el.innerHTML = '<div class="card"><div class="empty">' + esc(d.msg||'불러오지 못했습니다') + '</div></div>'; return; }

    function seg(k, t){ return '<button class="' + (SALE.period===k?'on':'') + '" onclick="salePick(\'' + k + '\')">' + t + '</button>'; }
    var h = '<div class="seg">' + seg('today','오늘') + seg('week','최근 7일') +
            seg('month','이번 달') + seg('prev','지난 달') + seg('year','올해') + '</div>';

    h += '<div class="grid2" style="margin-bottom:10px">' +
      '<div class="field" style="margin:0"><label>시작</label><input id="sl-f" type="date" value="' + SALE.from + '" onchange="saleRange()"></div>' +
      '<div class="field" style="margin:0"><label>끝</label><input id="sl-t" type="date" value="' + SALE.to + '" onchange="saleRange()"></div>' +
    '</div>';

    var shopOpt = '<option value="">전체 샵</option>' + (d.shops||[]).map(function(n){
      return '<option value="'+esc(n)+'"'+(n===SALE.shop?' selected':'')+'>'+esc(n)+'</option>'; }).join('');
    h += '<div class="field"><select onchange="saleShop(this.value)">' + shopOpt + '</select></div>';

    /* 핵심 지표 */
    var rate = d.customers ? Math.round(d.repeat / d.customers * 1000)/10 : 0;
    h += '<div class="card"><div class="card-b">' +
      '<div class="lb" style="font-size:.72rem;color:var(--muted);font-weight:600">실 매출액</div>' +
      '<div style="font-size:1.9rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums">' +
        won(d.total) + '<small style="font-size:.9rem;color:var(--muted);margin-left:3px">원</small></div>' +
      '<div style="margin-top:5px">' + deltaHtml(d.total, d.prevTotal) + '</div>' +
      '<div style="font-size:.75rem;color:var(--muted);margin-top:3px">직전 동일 기간 (' +
        esc(d.prevFrom.slice(5).replace('-','/')) + '~' + esc(d.prevTo.slice(5).replace('-','/')) + ') ' +
        won(d.prevTotal) + '원</div>' +
      '<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px">' +
        '<div class="kv"><span>네이버 수수료 <span style="color:var(--muted);font-size:.8rem">· ' +
          (d.feeRate||0) + '%</span></span><b style="color:var(--bad)">− ' + won(d.naverFee||0) + '원</b></div>' +
        '<div class="kv"><span>카드 수수료 <span style="color:var(--muted);font-size:.8rem">· 신용 ' +
          (d.creditRate||0) + '% · 체크 ' + (d.debitRate||0) + '%</span></span>' +
          '<b style="color:var(--bad)">− ' + won(d.cardFee||0) + '원</b></div>' +
        '<div class="kv"><span style="font-weight:700">실수령액</span>' +
          '<b style="font-weight:700">' + won(d.net||d.total) + '원</b></div>' +
      '</div>' +
      (d.npayMixed ? '<div style="font-size:.75rem;color:var(--muted);margin-top:6px">' +
        '카드와 네이버페이를 같이 쓴 예약 ' + d.npayMixed + '건은 네이버 결제액을 안 적어서 수수료에서 빠졌습니다.</div>' : '') +
      '</div></div>';

    h += '<div class="tiles">' +
      '<div class="tile"><div class="lb">총 고객수</div><div class="vl">' + d.customers + '<small>명</small></div></div>' +
      '<div class="tile"><div class="lb">시술 건수</div><div class="vl">' + d.count + '<small>건</small></div></div>' +
    '</div>' +
    '<div class="tiles">' +
      '<div class="tile"><div class="lb">재방문율</div><div class="vl">' + rate + '<small>%</small></div>' +
        '<div style="font-size:.72rem;color:var(--muted);margin-top:2px">' + d.repeat + '명 재방문</div></div>' +
      '<div class="tile"><div class="lb">1인당 평균</div><div class="vl" style="font-size:1.05rem">' +
        won(d.avg) + '<small>원</small></div></div>' +
    '</div>';

    /* 일자별 추이 */
    var days = Object.keys(d.byDay||{}).sort();
    if(days.length){
      var mx = 1; days.forEach(function(k){ if(d.byDay[k]>mx) mx=d.byDay[k]; });
      h += '<div class="sec-title">기간 내 추이</div><div class="card"><div class="card-b">' +
        '<div class="bars">';
      days.forEach(function(k){
        h += '<div class="b"><i style="height:' + Math.round(d.byDay[k]/mx*100) + '%" title="' +
             k + ' ' + won(d.byDay[k]) + '원"></i><span>' + k.slice(8) + '</span></div>';
      });
      h += '</div></div></div>';
    }

    /* 샵별 */
    var sn = Object.keys(d.byShop||{});
    if(sn.length > 1 || (sn.length && !SALE.shop)){
      h += '<div class="sec-title">샵별 매출</div><div class="card"><div class="card-b">';
      sn.forEach(function(n){
        h += '<div class="kv"><span>' + esc(shopShort(n)) + '</span><b>' + won(d.byShop[n]) + '원</b></div>';
      });
      h += '</div></div>';
    }

    /* 시술별 */
    if(d.byItem && d.byItem.length){
      h += '<div class="sec-title">시술별 매출</div><div class="card"><div class="card-b"><div class="dtwrap"><table class="dt">' +
        '<tr><th>시술</th><th class="r">건수</th><th class="r">매출</th><th class="r">비중</th></tr>';
      d.byItem.slice(0,30).forEach(function(x){
        var pc = d.total ? Math.round(x.total/d.total*1000)/10 : 0;
        h += '<tr><td>' + esc(x.name) + '</td><td class="r">' + x.n + '</td>' +
             '<td class="r">' + won(x.total) + '</td><td class="r">' + pc + '%</td></tr>';
      });
      h += '</table></div></div></div>';
    }

    /* 요일별 */
    var DOW = ['일','월','화','수','목','금','토'];
    if(d.byDow){
      var dmax = 1; DOW.forEach(function(_,i){ if((d.byDow[i]||0)>dmax) dmax=d.byDow[i]; });
      h += '<div class="sec-title">요일별 매출</div><div class="card"><div class="card-b">';

        var v = d.byDow[i]||0;
        h += '<div style="display:flex;align-items:center;gap:9px;padding:5px 0">' +
          '<span style="width:22px;font-weight:700;font-size:.85rem">' + t + '</span>' +
          '<span style="flex:1;height:9px;background:var(--line);border-radius:5px;overflow:hidden">' +
            '<i style="display:block;height:100%;width:' + Math.round(v/dmax*100) + '%;background:var(--plum)"></i></span>' +
          '<b style="font-size:.82rem;width:88px;text-align:right;font-variant-numeric:tabular-nums">' + won(v) + '</b></div>';
      });
      h += '</div></div>';
    }

    /* 결제수단별 */
    var pk = Object.keys(d.byPay||{}).filter(function(k){ return k; });
    if(pk.length){
      h += '<div class="sec-title">결제수단별</div><div class="card"><div class="card-b">';
      pk.sort(function(a,b){ return d.byPay[b]-d.byPay[a]; }).forEach(function(k){
        var pc = d.total ? Math.round(d.byPay[k]/d.total*1000)/10 : 0;
        h += '<div class="kv"><span>' + esc(k) + ' <span style="color:var(--muted);font-size:.8rem">· ' + pc + '%</span></span>' +
             '<b>' + won(d.byPay[k]) + '원</b></div>';
      });
      h += '</div></div>';
    }

    /* 매출 내역 */
    h += '<div class="sec-title">매출 내역 · ' + d.list.length + '건' +
         (d.count > d.list.length ? ' (앞 ' + d.list.length + '건)' : '') + '</div>';
    if(!d.list.length){
      h += '<div class="card"><div class="empty">이 기간에 등록된 매출이 없습니다</div></div>';
    } else {
      h += '<div class="card"><div class="card-b"><div class="dtwrap"><table class="dt">' +
        '<tr><th>날짜</th><th>고객</th><th>시술</th><th class="r">금액</th></tr>';
      d.list.forEach(function(g){
        h += '<tr><td>' + esc(String(g.date).slice(5).replace('-','/')) + '</td>' +

          '<td>' + esc((g.items&&g.items.length?g.items.join(', '):'-')) + (g.pay ? '<br><span style="color:var(--muted);font-size:.74rem">' + esc(payLabel(g.pay)) + '</span>' : '') + '</td>' +
          '<td class="r">' + won(g.amount) + '</td></tr>';
      });

    h += '<div class="sec-title">더 보기</div><div class="card"><div class="card-b">' +
      '<button class="btn sub" style="margin-bottom:9px" onclick="openStaff()">👥 직원별 결산</button>' +
      '<button class="btn sub" style="margin-bottom:9px" onclick="openCash()">💵 수입 · 지출 (순수익)</button>' +
      '<button class="btn sub" onclick="openUsage()">📊 이용률 분석 (빈 시간 찾기)</button>' +

      '예약을 눌러 [결제 등록]으로 넣은 금액만 집계됩니다. 재방문율은 이 기간 이전에도 결제 기록이 있는 고객 비율입니다.</p>';

    el.innerHTML = h;
    pgDone('p-sale', SALE.key);
  }).catch(fail);
}

function loadPpLog(){

        (g.memo ? ' <span style="color:var(--muted);font-size:.8rem">' + esc(g.memo) + '</span>' : '') + '</span>' +
        '<b style="color:' + (plus?'var(--good)':'var(--bad)') + '">' + (plus?'+':'') + won(g.amount) +
        ' <span style="color:var(--muted);font-weight:500">→ ' + won(g.left) + '</span></b></div>';
    });

function savePp(btn){
  var amt = $('pp-amt').value;
  if(!Number(amt)){ toast('금액을 넣어주세요'); return; }
  busy(btn,'저장 중…');
  call('api_savePp',[{custId:PP.id, type:PP.type, way:PP.way, amount:amt, memo:$('pp-memo').value}]).then(function(r){
    done(btn);
    if(!r.ok){ toast(r.msg||'저장하지 못했습니다'); return; }
    toast('남은 ' + PP.type + ' ' + won(r.left) + (PP.type==='포인트'?'P':'원'));

function saveBlock(btn, id){

            start:$('bl-s').value, end:$('bl-e').value,
            shop:$('bl-shop').value, memo:$('bl-m').value };

  if(!p.start){ toast('시작 시간을 넣어주세요'); return; }

    done(btn);

function busy(btn, txt){ btn.dataset.o = btn.textContent; btn.textContent = txt; btn.disabled = true; }
function done(btn){ if(btn.dataset.o) btn.textContent = btn.dataset.o; btn.disabled = false; }

function doCheckMail(btn){
  busy(btn, '메일 확인 중… (최대 1분)');
  call('api_checkMail').then(function(r){
    done(btn);
    var s = r.stat;
    if(!s.total) toast('새로 처리할 메일이 없습니다');
    else toast('새 예약 ' + s.created + ' · 변경 ' + s.updated + ' · 취소 ' + s.canceled +
               (s.failed ? ' · 확인필요 ' + s.failed : ''));
    APP.boot.lastMail = r.lastMail;
    $('p-home').dataset.loaded = ''; pgClear(); APP.month = null;
    renderTool();
  }).catch(function(e){ done(btn); fail(e); });
}
function doSendDay(offset, btn){
  var d = new Date(); d.setDate(d.getDate()+offset);
  var key = ymd(d);
  busy(btn, '대상 확인 중…');
  call('api_day',[key]).then(function(r){
    var targets = r.list.filter(function(o){ return o.status==='확정' && (o.phone||o.safe); });
    if(!targets.length){ done(btn); toast('보낼 대상이 없습니다'); return; }
    if(!confirm(targets.length + '명에게 안내 메시지를 보냅니다.\n계속할까요?')){ done(btn); return; }
    btn.textContent = '보내는 중…';
    return call('api_send',[targets.map(function(o){return o.resno;}), offset===1?'전일':'당일'])
      .then(function(res){
        done(btn);
        if(res.testMode) toast('테스트 모드 · 실제로는 나가지 않았습니다 (' + res.sent + '건 기록)');
        else toast('보냄 ' + res.sent + '건 / 실패 ' + res.failed + '건');
      });
  }).catch(function(e){ done(btn); fail(e); });
}
function doRescan(btn){
  busy(btn, '찾는 중…');
  call('api_rescanRequests').then(function(r){
    done(btn);
    if(!r.ok){ toast(r.msg || '실패했습니다'); return; }
    toast(r.n ? (r.n + '건에서 실명·연락처를 채웠습니다') : '요청사항에서 새로 찾은 정보가 없습니다');
    $('p-home').dataset.loaded = ''; pgClear();
    renderTool();
  }).catch(function(e){ done(btn); fail(e); });
}
function doComplete(btn){
  if(!confirm('오늘 이전의 확정 예약을 모두 "이용완료"로 바꿉니다.\n회차 상품은 사용회차가 1씩 올라갑니다.\n\n계속할까요?')) return;
  busy(btn, '처리 중…');
  call('api_completePast').then(function(r){
    done(btn); toast(r.n + '건을 이용완료로 바꿨습니다');
    $('p-home').dataset.loaded = ''; pgClear();
  }).catch(function(e){ done(btn); fail(e); });
}

  }
  var keys = '';
  for(var i=1;i<=9;i++) keys += '<button onclick="pinKey(\''+i+'\')">'+i+'</button>';
  keys += '<button class="f" onclick="pinClear()">지움</button>' +
          '<button onclick="pinKey(\'0\')">0</button>' +
          '<button class="f" onclick="pinBack()">←</button>';
  var d = document.createElement('div');
  d.id = 'lockwrap';
  d.innerHTML =
    '<div class="lockbox">' +
      '<div class="lockicon">🔒</div>' +
      '<h2>뷰로그</h2><p style="margin:-6px 0 14px;opacity:.75;font-size:13px">아름다움을 기록하다</p>' +
      '<p class="locksub" id="lock-sub">번호를 눌러주세요</p>' +
      '<div class="pindots" id="pindots"></div>' +
      '<div id="pintextwrap" style="display:none">' +
        '<input id="pintext" type="password" autocomplete="current-password" placeholder="번호 또는 비밀번호">' +
      '</div>' +
      '<div id="lock-msg" class="lockmsg">' + (msg ? esc(msg) : '') + '</div>' +
      '<div class="keys" id="pinkeys">' + keys + '</div>' +
      '<button class="btn" style="margin-top:12px" onclick="doLogin(this)">들어가기</button>' +
      '<button id="pinmodebtn" class="lockswap" onclick="pinMode()">⌨ 문자가 섞인 번호 입력</button>' +
    '</div>';
  document.body.appendChild(d);
  PIN = ''; PINTEXT = false; drawPin();
  document.addEventListener('keydown', pinKeyboard);
}
/* 번호판 ↔ 글자 입력 전환 */
function pinMode(){
  PINTEXT = !PINTEXT;
  var kp = document.getElementById('pinkeys'),
      dt = document.getElementById('pindots'),
      tw = document.getElementById('pintextwrap'),
      bt = document.getElementById('pinmodebtn'),
      sb = document.getElementById('lock-sub');
  if(!kp) return;
  kp.style.display = PINTEXT ? 'none' : 'grid';
  dt.style.display = PINTEXT ? 'none' : 'flex';
  tw.style.display = PINTEXT ? 'block' : 'none';
  bt.textContent = PINTEXT ? '🔢 번호판으로 입력' : '⌨ 문자가 섞인 번호 입력';
  sb.textContent = PINTEXT ? '번호나 비밀번호를 적어주세요' : '번호를 눌러주세요';
  PIN = ''; drawPin();
  var ti = document.getElementById('pintext');
  if(ti){ ti.value = ''; if(PINTEXT) setTimeout(function(){ try { ti.focus(); } catch(e){} }, 120); }
}
function drawPin(){
  var el = document.getElementById('pindots');
  if(!el) return;
  var n = Math.max(PIN.length, 4), h = '';
  for(var i=0;i<n;i++) h += '<i class="' + (i<PIN.length?'f':'') + '"></i>';
  el.innerHTML = h;
}
function pinKey(c){ if(PIN.length<12){ PIN += c; drawPin(); } }
function pinBack(){ PIN = PIN.slice(0,-1); drawPin(); }
function pinClear(){ PIN = ''; drawPin(); }
function pinKeyboard(ev){
  if(!document.getElementById('lockwrap')) return;
  if(ev.key === 'Enter'){ doLogin(); return; }
  if(PINTEXT) return;                       /* 글자 입력칸에 맡깁니다 */
  if(ev.key >= '0' && ev.key <= '9') pinKey(ev.key);
  else if(ev.key === 'Backspace') pinBack();
}
function hideLock(){
  var d = document.getElementById('lockwrap');
  if(d) d.parentNode.removeChild(d);
  document.removeEventListener('keydown', pinKeyboard);
  PIN = '';
}
function doLogin(btn){
  var ti = document.getElementById('pintext');
  var pw = PINTEXT ? (ti ? ti.value.trim() : '') : PIN;
  if(!pw) return;
  if(btn) busy(btn, '확인 중…');
  call('api_login',[pw],true).then(function(r){
      if(btn) done(btn);
      if(!r || !r.ok){
        document.getElementById('lock-msg').textContent = (r && r.msg) || '들어가지 못했습니다';
        PIN = ''; drawPin();
        if(ti) ti.value = '';
        return;
      }
      APP.token = r.token; tkSet(r.token);
      APP.role = r.role || 'owner'; APP.me = r.name || '';
      hideLock(); boot();
    }).catch(function(e){
      if(btn) done(btn);
      document.getElementById('lock-msg').textContent = (e && e.message) || '문제가 생겼습니다';
      PIN = ''; drawPin();
      if(ti) ti.value = '';
    });
}
function doLogout(){
  tkSet(''); APP.token = ''; APP.role = 'owner'; APP.me = '';
  location.reload();
}

/* ══════════ 시작 ══════════ */
function boot(){
  call('api_bootstrap').then(function(b){
    APP.boot = b;
    APP.day = b.today;
    APP.role = b.role || 'owner';
    APP.me = b.me || '';
    hideLock();
    applyRole();
    renderHome();
  }).catch(function(e){
    if(document.getElementById('lockwrap')) return;
    $('p-home').innerHTML = '<div class="card"><div class="empty">시작하지 못했습니다.<br><small>' +
      esc(e && e.message) + '</small><br><br>구글시트에서 [초기세팅]을 먼저 실행했는지 확인해 주세요.</div></div>';
  });
}
boot();
</script>
</body>
</html>
